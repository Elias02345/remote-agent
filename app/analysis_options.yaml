include: package:flutter_lints/flutter.yaml

analyzer:
  # Warnings are errors in CI. A lint job that only ever prints advice gets
  # ignored within a week.
  errors:
    invalid_annotation_target: ignore
    missing_required_param: error
    missing_return: error
    todo: ignore
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - avoid_print
    # require_trailing_commas is deliberately absent: it is a formatter's job,
    # `dart format` inserts them, and having CI fail on it means real errors
    # scroll past under a wall of comma advice.
