name: claudecode_remote
description: Persistent terminal sessions for coding agents, on your own server.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Terminal emulation happens entirely client-side (architecture Section 5.1);
  # the daemon only moves raw bytes. xterm.dart is the same emulation layer
  # that renders vim, htop and tmux correctly.
  xterm: ^4.0.0
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  # SHA-256 for the client-side half of the double hash check (architecture
  # Section 8.2). Not in dart:core, and this is the standard pub package for
  # it rather than hand-rolling the algorithm.
  crypto: ^3.0.3
  # AccumulatorSink, for hashing a file in chunks instead of loading it whole.
  # Already in the tree as a transitive dependency of crypto; named here because
  # upload.dart imports it directly.
  convert: ^3.1.1
  # Ed25519 keypair generation and signing for device auth (architecture
  # Section 5.4). Not in dart:core, and this is the standard pub package for
  # it rather than hand-rolling the algorithm.
  cryptography: ^2.9.0
  # Stores the device's Ed25519 private key in Android Keystore / Windows
  # DPAPI / libsecret. Plain file/prefs storage would put the key in a phone
  # backup, and restoring that backup on another device would clone a
  # "working" device identity nothing can tell apart from the original.
  flutter_secure_storage: ^11.0.0
  # Persists the operator-supplied daemon address across restarts. Not
  # security-sensitive like the device key, so SharedPreferences is enough.
  shared_preferences: ^2.5.5
  # Opens the pairing URL in the system browser — the three-factor chain
  # happens there, not in this app (see pairing.dart).
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
