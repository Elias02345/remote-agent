name: claudecode_remote
description: Persistent terminal sessions for coding agents, on your own server.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Terminal emulation happens entirely client-side (architecture Section 5.1);
  # the daemon only moves raw bytes. xterm.dart is the same emulation layer
  # that renders vim, htop and tmux correctly.
  xterm: ^4.0.0
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  # SHA-256 for the client-side half of the double hash check (architecture
  # Section 8.2). Not in dart:core, and this is the standard pub package for
  # it rather than hand-rolling the algorithm.
  crypto: ^3.0.3
  # AccumulatorSink, for hashing a file in chunks instead of loading it whole.
  # Already in the tree as a transitive dependency of crypto; named here because
  # upload.dart imports it directly.
  convert: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
