name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          # Select by shebang, not by extension. Several scripts here are
          # installed as commands and deliberately have no .sh suffix
          # (agentctl, agent-run); an extension filter silently skipped them,
          # so they went unlinted until it was noticed by hand. Matching the
          # first line instead needs no maintenance when the next one appears.
          # Only the first line counts: docs/ARCHITECTURE.md quotes shebangs
          # inside code blocks and must not be fed to shellcheck.
          status=0
          while IFS= read -r -d '' f; do
            head -n1 "$f" | grep -Eq '^#!.*(bash|sh)$' || continue
            echo "linting: ${f}"
            bash -n "$f" || status=1
            # -x follows sourced files. Without it, provision.sh sourcing
            # lib/common.sh is reported as SC1091 and the build fails on a
            # finding that says nothing about the code.
            shellcheck -x "$f" || status=1
          done < <(find . \( -name .git -o -name .wiki-clone \) -prune -o -type f -print0)
          exit "$status"

  # ponytail: this job now runs for real. It was originally left out with a
  # "prove it locally first" comment, but there is no local Docker/Podman on
  # the machine developing this repo (WSL2 Ubuntu, shellcheck only) --
  # ubuntu-latest is the only place that can actually execute this harness,
  # so deferring it further would mean it never runs at all. Gated behind
  # `needs: shellcheck` so a lint error fails fast without paying for an
  # Arch container pull + provisioning run.
  provisioning-harness:
    name: Provisioning container harness
    needs: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run provisioning harness
        # Invoked through bash on purpose. The exec bit is set in the index,
        # but this repo is authored on Windows where it is easy to lose on a
        # newly added script, and this job should fail on harness logic, not
        # on a file mode.
        run: bash server-provisioning/test/run-tests.sh

  # Independent of the provisioning harness -- agentctl is tested on its own,
  # so these two jobs run in parallel behind the same lint gate.
  agentctl-harness:
    name: agentctl container harness
    needs: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run agentctl harness
        run: bash server-provisioning/test/run-agentctl-tests.sh

  idle-update-harness:
    name: Idle update container harness
    needs: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run idle update harness
        run: bash server-provisioning/test/run-idle-update-tests.sh

  daemon:
    name: Daemon build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download dependencies
        run: go mod download

      # go.sum is committed, so CI verifies against pinned hashes rather than
      # re-resolving on every run. This step fails if go.mod/go.sum drift out
      # of sync with the imports -- otherwise a dependency could change
      # underneath the build without anything in the repo recording it.
      - name: Verify go.mod and go.sum are in sync
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build
        run: go build ./...
