name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          # Select by shebang, not by extension. Several scripts here are
          # installed as commands and deliberately have no .sh suffix
          # (agentctl, agent-run); an extension filter silently skipped them,
          # so they went unlinted until it was noticed by hand. Matching the
          # first line instead needs no maintenance when the next one appears.
          # Only the first line counts: docs/ARCHITECTURE.md quotes shebangs
          # inside code blocks and must not be fed to shellcheck.
          status=0
          while IFS= read -r -d '' f; do
            head -n1 "$f" | grep -Eq '^#!.*(bash|sh)$' || continue
            echo "linting: ${f}"
            bash -n "$f" || status=1
            # -x follows sourced files. Without it, provision.sh sourcing
            # lib/common.sh is reported as SC1091 and the build fails on a
            # finding that says nothing about the code.
            shellcheck -x "$f" || status=1
          # Generated platform folders are pruned: `flutter create` writes a
          # vendor `gradlew` that trips a dozen style rules we neither own nor
          # should edit. Linting it would mean either a permanently red job or
          # blanket suppressions that also hide our own mistakes.
          done < <(find . \( -name .git -o -name .wiki-clone -o -name build -o -name .dart_tool \
                          -o -path ./app/android -o -path ./app/ios \
                          -o -path ./app/linux -o -path ./app/windows -o -path ./app/macos \) \
                        -prune -o -type f -print0)
          exit "$status"

  # ponytail: this job now runs for real. It was originally left out with a
  # "prove it locally first" comment, but there is no local Docker/Podman on
  # the machine developing this repo (WSL2 Ubuntu, shellcheck only) --
  # ubuntu-latest is the only place that can actually execute this harness,
  # so deferring it further would mean it never runs at all. Gated behind
  # `needs: shellcheck` so a lint error fails fast without paying for an
  # Arch container pull + provisioning run.
  provisioning-harness:
    name: Provisioning container harness
    needs: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run provisioning harness
        # Invoked through bash on purpose. The exec bit is set in the index,
        # but this repo is authored on Windows where it is easy to lose on a
        # newly added script, and this job should fail on harness logic, not
        # on a file mode.
        run: bash server-provisioning/test/run-tests.sh

  # Independent of the provisioning harness -- agentctl is tested on its own,
  # so these two jobs run in parallel behind the same lint gate.
  agentctl-harness:
    name: agentctl container harness
    needs: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run agentctl harness
        run: bash server-provisioning/test/run-agentctl-tests.sh

  idle-update-harness:
    name: Idle update container harness
    needs: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run idle update harness
        run: bash server-provisioning/test/run-idle-update-tests.sh

  backup-harness:
    name: Backup and Samba container harness
    needs: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run backup harness
        run: bash server-provisioning/test/run-backup-tests.sh

  # Additional to the four harnesses above, not a replacement for any of
  # them: this is the only job that boots systemd as PID 1, so it is the
  # only place a unit gets enabled AND started, a oneshot service runs to
  # completion via `systemctl start`, and its journal gets read back. It is
  # also the slowest job in this workflow by a wide margin -- a privileged
  # container boot, a full four-script install chain run twice, and a Go
  # build, all in series -- so it stays gated behind `needs: shellcheck`
  # like the others rather than running unconditionally.
  e2e-harness:
    name: End-to-end systemd container harness
    needs: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run e2e harness
        run: bash server-provisioning/test/run-e2e-tests.sh

  app:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The only third-party action in this workflow. There is no practical
      # alternative: installing the Flutter SDK by hand means fetching a
      # tarball, pinning a channel and managing its cache, which is exactly
      # what this action does and does correctly.
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # `flutter analyze` treats infos as fatal by default, so --no-fatal-infos
      # is required, not merely implied by --fatal-warnings. Errors and warnings
      # still fail the build; style suggestions do not, or the job becomes noise
      # nobody reads and a real error hides inside it.
      - name: Analyze
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      # Web is deliberately not a target any more: a browser cannot hold a
      # hardware-backed device key, and carrying a fourth platform whose
      # identity story is strictly weaker than the other three was not worth
      # it. app/web/ is gone, so there is nothing to build here.
      #
      # Linux and Windows are still built, because analyze and test run
      # against lib/ and never touch a platform runner — they cannot tell you
      # whether the app still builds for one.
      # libsecret and jsoncpp are flutter_secure_storage_linux's dependencies,
      # not Flutter's own. The device's Ed25519 private key goes into the
      # system keyring rather than a file, which is the whole reason that
      # plugin is in the dependency list — so on Linux the keyring library is
      # a build requirement, and its absence fails at link time with an error
      # that says nothing about keys.
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev

      - name: Build for Linux desktop
        run: flutter build linux --release

  flutter-windows:
    name: Flutter Windows build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Its own job because it needs a Windows runner and the MSVC toolchain.
      # Worth the extra runner: the Windows target is one of the four the
      # architecture names, and nothing else in CI would notice it breaking.
      - name: Build for Windows desktop
        run: flutter build windows --release

  daemon:
    name: Daemon build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'

      - name: Download dependencies
        run: go mod download

      # go.sum is committed, so CI verifies against pinned hashes rather than
      # re-resolving on every run. This step fails if go.mod/go.sum drift out
      # of sync with the imports -- otherwise a dependency could change
      # underneath the build without anything in the repo recording it.
      - name: Verify go.mod and go.sum are in sync
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build
        run: go build ./...

      # Catches the case that started this: the toolchain was pinned to a patch
      # release with 27 known vulnerabilities reachable from this code,
      # including request smuggling in net/http, and nothing in CI noticed for
      # weeks. Runs on every push so a dependency going bad is a red build
      # rather than something found by hand months later.
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...
